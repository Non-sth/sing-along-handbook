name: 💡 功能建议
description: 想要新功能，或对现有功能有改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述场景，不用先想方案
      placeholder: 我练到某一句想反复听，但现在得手动拖进度条……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      description: 本项目有两个硬约束，涉及它们的建议大概率无法实现
      options:
        - label: 我的建议**不需要**引入第三方库（AndroidX / Gradle 依赖会破坏手工构建链）
        - label: 我的建议**不需要**联网或服务端（本项目是刻意的离线设计）
